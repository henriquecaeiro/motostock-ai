services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATA_BACKEND: sqlite
      DATABASE_PATH: /app/storage/motostock.db
      AUTO_IMPORT_CSV: "true"
      RAG_KNOWLEDGE_BASE_PATH: /app/knowledge_base
      RAG_STORAGE_PATH: /app/storage/rag
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}
    ports:
      - "8000:8000"
    volumes:
      - motostock_storage:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Optional local Ollama service. It is not started by the default profile.
  # Start it with: docker compose --profile ollama up --build
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 5

volumes:
  motostock_storage:
  ollama_models:
